name: Android Build APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  # So a fork's owner can build their own copy without a tag: the release job below only runs on the
  # public repository, and the push trigger above only fires on one. A debug build needs no secrets,
  # which is also why it runs everywhere this workflow does - on a fork the keystore and the Sentry
  # key are unreadable, and a job that asked for them could not be triggered from there at all.
  workflow_dispatch:

jobs:
  build:
    # This file lives in both repositories - it is on the list the bridge publishes - but only the
    # public one builds releases: the private repository holds the tags of every release ever made,
    # and re-running them there would burn its minutes on builds nobody asked for.
    if: github.repository == 'just-plus-player/just-plus-player'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${GITHUB_WORKSPACE}/keystore.jks

      - run: ./gradlew assembleLatestUniversalRelease
          -PSENTRY_DSN=${{ secrets.SENTRY_DSN }}
          -Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=key
          -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      # A second copy under a name that never changes. It is what makes
      # releases/latest/download/JustPlus.Player.apk resolve after every release — the fixed URL a
      # Downloader short code points at, since GitHub can only redirect to an exact asset name. Same
      # build as the versioned asset beside it, so whichever one anything picks is the same file.
      - run: cp app/build/outputs/apk/latestUniversal/release/*.apk JustPlus.Player.apk

      # The release notes travel in the tag's annotation. This repository's history is one commit per
      # release, so there is nothing here to generate them from, and the app itself shows them —
      # Updater.java reads the release body and renders it as Markdown.
      #
      # The fetch first, because checkout leaves the tag lightweight: it fetches it by commit SHA, so
      # %(contents) read the commit's message instead - v2.0.1 was drafted with "v2.0.1 (#211)" as its
      # notes. Fetching the tag itself puts the annotated object back.
      - run: |
          git fetch --no-tags --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/latestUniversal/release/*.apk
            JustPlus.Player.apk
          prerelease: true
          draft: true

  # The other half of this workflow, and the only half a fork can run. The job above needs a tag and
  # the public repository's secrets, and publishes what it builds; this one builds an unsigned debug
  # APK of master, and keeps every ABI so a single artifact installs on the television that will be
  # used to read a Dolby Vision state line back. No secrets, so it is the only job that runs on a
  # fork, where the keystore and the Sentry key are unreadable to begin with.
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Not assembleLatestUniversalRelease: the release type drops the two Intel ABIs, and the point
      # of this build is to be installable wherever the fault is being read back from.
      - run: ./gradlew assembleLatestUniversalDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JustPlus.Player.debug
          path: app/build/outputs/apk/latestUniversal/debug/*.apk

  # A release of the fork's own. The job above belongs to the public repository, which owns the
  # signing key and the download URL every existing install polls; a fork has neither, so this one
  # builds the same release variant and publishes it from the fork's own key, which travels in the
  # secrets below.
  #
  # Its own key, not the runner's debug key: that one is generated per run, so every build came out
  # with a different signature and an install could not take the next build as an update. The key
  # here does not change, so from this release onward updates install over each other. The first one
  # is a one-time exception — it carries a different signature from the debug builds before it and
  # has to replace one by uninstall.
  fork-release:
    if: github.repository != 'just-plus-player/just-plus-player' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: |
          test -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" || {
            echo "RELEASE_KEYSTORE_BASE64 is not set on this repository." >&2
            exit 1
          }
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ${GITHUB_WORKSPACE}/keystore.jks
          keytool -list -keystore ${GITHUB_WORKSPACE}/keystore.jks \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" | tail -2

      # Before the build, twice over. The notes travel in the tag's annotation, and the version name
      # comes from what `git describe` finds: checkout fetches the tag by commit and leaves the
      # annotated object behind, so without this the build would name itself after the commit hash.
      - run: |
          git fetch --no-tags --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          git describe --tags

      - run: ./gradlew assembleLatestUniversalRelease
          -Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=justplus
          -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - run: cp app/build/outputs/apk/latestUniversal/release/*.apk JustPlus.Player.apk

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            app/build/outputs/apk/latestUniversal/release/*.apk
            JustPlus.Player.apk
          draft: false
          prerelease: false
